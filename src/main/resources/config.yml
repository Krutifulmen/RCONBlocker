# RCONBlocker Configuration

# Блокировать все RCON соединения (игнорирует allowed-ips)
block-all: false

# Разрешенные IP-адреса для RCON
# Поддерживает:
# - Одиночные IP: 192.168.1.1
# - Подсети: 192.168.1.0/24
# - Все: * (если block-all: false)
allowed-ips:
  - "127.0.0.1"
  - "192.168.1.1"
  - "10.0.0.0/8"

# Сообщение при отключении (отправляется в лог)
kick-message: "&cВаш IP-адрес не имеет доступа к RCON"
