name: Build RconBlocker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Получаем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Ставим Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 3️⃣ Ставим Gradle (нужен для wrapper)
      - name: Install Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4.1   # последняя стабильная версия

      # 4️⃣ Делаем wrapper, если его нет
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      # 5️⃣ Сборка плагина через Gradle Wrapper + Paperweight
      - name: Build plugin
        run: ./gradlew build --no-daemon

      # 6️⃣ Загружаем готовый jar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RconBlocker
          path: build/libs/*-reobf.jar
